# Build, test and deploy English Trainer to Google Cloud.
#
# Authentication is keyless: GitHub's OIDC token is exchanged for the deployer
# service account through Workload Identity Federation (created by
# infra/setup.sh). Repository variables required:
#   GCP_PROJECT_ID, GCP_REGION, WIF_PROVIDER, DEPLOYER_SA
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: english-trainer-api
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/english-trainer/api
  BOT_SERVICE: english-trainer-bot
  BOT_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/english-trainer/bot

jobs:
  test:
    name: Backend tests (Firestore emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend

  test-bot:
    name: Bot tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: bot
      - run: python -m pytest -q
        working-directory: bot

  deploy-backend:
    name: Deploy API to Cloud Run
    needs: [test, test-bot]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Build and push image
        run: |
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" backend
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
      - name: Deploy revision
        run: |
          sed "s#image: .*#image: $IMAGE:$GITHUB_SHA#" infra/cloudrun-service.yaml > /tmp/service.yaml
          # The bot key is added only once infra/setup-bot.sh created the secret (DEPLOY_BOT=true).
          if [ "${{ vars.DEPLOY_BOT }}" = "true" ]; then
            python3 - <<'PY'
          import re
          p = '/tmp/service.yaml'
          s = open(p).read()
          extra = ('            - name: BOT_API_KEY\n              valueFrom:\n                secretKeyRef:\n'
                   '                  name: bot-api-key\n                  key: latest\n')
          s = re.sub(r'(\n          resources:)', '\n' + extra.rstrip('\n') + r'\1', s, count=1)
          open(p, 'w').write(s)
          PY
          fi
          gcloud run services replace /tmp/service.yaml --region "$REGION" --project "$PROJECT_ID"
          gcloud run services add-iam-policy-binding "$SERVICE" --region "$REGION" --project "$PROJECT_ID" \
            --member=allUsers --role=roles/run.invoker --quiet
      - name: Smoke check
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')
          echo "Service URL: $URL"
          curl --fail --silent --show-error "$URL/health"

  deploy-bot:
    name: Deploy Telegram bot to Cloud Run
    needs: deploy-backend
    if: vars.DEPLOY_BOT == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Build and push the bot image
        run: |
          docker build -t "$BOT_IMAGE:$GITHUB_SHA" -t "$BOT_IMAGE:latest" bot
          docker push "$BOT_IMAGE:$GITHUB_SHA"
          docker push "$BOT_IMAGE:latest"
      - name: Deploy the bot service
        run: |
          sed "s#image: .*#image: $BOT_IMAGE:$GITHUB_SHA#" infra/cloudrun-bot.yaml > /tmp/bot.yaml
          gcloud run services replace /tmp/bot.yaml --region "$REGION" --project "$PROJECT_ID"
          gcloud run services add-iam-policy-binding "$BOT_SERVICE" --region "$REGION" --project "$PROJECT_ID" \
            --member=allUsers --role=roles/run.invoker --quiet
      - name: Health check
        run: |
          URL=$(gcloud run services describe "$BOT_SERVICE" --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')
          curl --fail --silent --show-error "$URL/health"

  deploy-frontend:
    name: Deploy site to Firebase Hosting
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - name: Build React app
        run: |
          npm ci
          npm run build
        working-directory: frontend
        env:
          CI: "false"
      - name: Deploy Hosting and Firestore rules
        # The Hosting release API occasionally answers HTTP 500 after the
        # upload succeeded; the deploy is idempotent, so retry a few times.
        run: |
          for attempt in 1 2 3; do
            if npx --yes firebase-tools@14 deploy --only hosting,firestore --project "$PROJECT_ID" --non-interactive; then
              exit 0
            fi
            echo "firebase deploy failed (attempt $attempt); retrying in 30s"
            sleep 30
          done
          exit 1
