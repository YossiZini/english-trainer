  <text x="400" y="280" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Level 1</text>
  <text x="400" y="340" font-family="Arial, sans-serif" font-size="32" fill="#FFFFFF" text-anchor="middle">Training Camp</text>
  <text x="400" y="380" font-family="Arial, sans-serif" font-size="20" fill="#FFFFFF" opacity="0.7" text-anchor="middle">0-19 points</text>
