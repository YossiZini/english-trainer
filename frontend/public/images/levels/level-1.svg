<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Training Camp - Brown/Wooden theme -->
  <rect width="800" height="600" fill="#8B7355"/>
  <rect x="100" y="100" width="600" height="400" fill="#A0826D" stroke="#654321" stroke-width="4" rx="10"/>
  <circle cx="200" cy="200" r="40" fill="#654321" opacity="0.3"/>
  <circle cx="600" cy="200" r="40" fill="#654321" opacity="0.3"/>
