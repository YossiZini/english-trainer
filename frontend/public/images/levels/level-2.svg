  <rect x="100" y="100" width="600" height="400" fill="#3A6B1F" stroke="#1a3a0f" stroke-width="4" rx="10"/>
  <circle cx="200" cy="200" r="40" fill="#1a3a0f" opacity="0.3"/>
  <circle cx="600" cy="200" r="40" fill="#1a3a0f" opacity="0.3"/>
