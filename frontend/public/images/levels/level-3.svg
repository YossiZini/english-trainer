<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Bone Pit - Dark Spooky Arena -->
  <defs>
    <linearGradient id="darkSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a1a3a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="purpleGlow">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Dark Sky -->
  <rect width="800" height="600" fill="url(#darkSky)"/>

  <!-- Purple fog/mist -->
  <ellipse cx="400" cy="500" rx="400" ry="100" fill="url(#purpleGlow)" opacity="0.3"/>

  <!-- Pit Structure -->
  <path d="M 100 450 L 200 250 L 600 250 L 700 450 Z" fill="#3d2557" stroke="#1a0a2a" stroke-width="6"/>
  <ellipse cx="400" cy="450" rx="300" ry="100" fill="#2a1a3a" stroke="#8b5cf6" stroke-width="4"/>

  <!-- Bone pillars -->
  <rect x="150" y="200" width="50" height="250" fill="#E8E4DC" stroke="#8b5cf6" stroke-width="3" opacity="0.9"/>
  <ellipse cx="175" cy="200" rx="30" ry="15" fill="#E8E4DC" opacity="0.9"/>
  <rect x="600" y="200" width="50" height="250" fill="#E8E4DC" stroke="#8b5cf6" stroke-width="3" opacity="0.9"/>
  <ellipse cx="625" cy="200" rx="30" ry="15" fill="#E8E4DC" opacity="0.9"/>

  <!-- Skull decorations -->
  <circle cx="250" cy="300" r="30" fill="#E8E4DC" opacity="0.8"/>
  <rect x="235" y="310" width="10" height="15" fill="#1a0a2a"/>
  <rect x="255" y="310" width="10" height="15" fill="#1a0a2a"/>
  <circle cx="550" cy="300" r="30" fill="#E8E4DC" opacity="0.8"/>
  <rect x="535" y="310" width="10" height="15" fill="#1a0a2a"/>
  <rect x="555" y="310" width="10" height="15" fill="#1a0a2a"/>

  <!-- Spooky orbs -->
  <circle cx="200" cy="180" r="25" fill="#8b5cf6" opacity="0.7">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="180" r="25" fill="#8b5cf6" opacity="0.7">
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Center Platform -->
  <ellipse cx="400" cy="380" rx="140" ry="70" fill="#3d2557" stroke="#8b5cf6" stroke-width="4"/>

  <!-- Text -->
  <text x="400" y="370" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#8b5cf6" text-anchor="middle">Level 3</text>
  <text x="400" y="405" font-family="Arial, sans-serif" font-size="28" fill="#FFFFFF" text-anchor="middle">Bone Pit</text>

  <!-- Stars -->
  <text x="300" y="150" font-size="35" opacity="0.9">⭐</text>
  <text x="400" y="135" font-size="35" opacity="0.9">⭐</text>
  <text x="500" y="150" font-size="35" opacity="0.9">⭐</text>
</svg>
