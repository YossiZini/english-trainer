<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- P.E.K.K.A's Playhouse - Tech/Metal Arena -->
  <defs>
    <linearGradient id="techSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#94a3b8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#cbd5e1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64748b;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="600" fill="url(#techSky)"/>

  <!-- Electric glow effects -->
  <circle cx="200" cy="150" r="50" fill="url(#blueGlow)" opacity="0.5">
    <animate attributeName="r" values="40;60;40" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="150" r="50" fill="url(#blueGlow)" opacity="0.5">
    <animate attributeName="r" values="50;70;50" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Ground -->
  <rect x="0" y="450" width="800" height="150" fill="#475569"/>

  <!-- Metal Arena Structure -->
  <rect x="120" y="200" width="560" height="280" fill="url(#metalGrad)" stroke="#1e293b" stroke-width="8" rx="20"/>

  <!-- Metal Panels -->
  <rect x="140" y="220" width="120" height="240" fill="#94a3b8" stroke="#64748b" stroke-width="3" opacity="0.7"/>
  <rect x="280" y="220" width="240" height="240" fill="#cbd5e1" stroke="#94a3b8" stroke-width="3"/>
  <rect x="540" y="220" width="120" height="240" fill="#94a3b8" stroke="#64748b" stroke-width="3" opacity="0.7"/>

  <!-- Electric Towers -->
  <rect x="100" y="150" width="40" height="330" fill="#64748b" stroke="#1e293b" stroke-width="4"/>
  <rect x="105" y="140" width="30" height="20" fill="#3b82f6">
    <animate attributeName="fill" values="#3b82f6;#60a5fa;#3b82f6" dur="1s" repeatCount="indefinite"/>
  </rect>
  <rect x="660" y="150" width="40" height="330" fill="#64748b" stroke="#1e293b" stroke-width="4"/>
  <rect x="665" y="140" width="30" height="20" fill="#3b82f6">
    <animate attributeName="fill" values="#60a5fa;#3b82f6;#60a5fa" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Lightning Bolts -->
  <path d="M 120 180 L 110 200 L 120 200 L 105 230" stroke="#60a5fa" stroke-width="4" fill="none" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <path d="M 680 180 L 690 200 L 680 200 L 695 230" stroke="#60a5fa" stroke-width="4" fill="none" opacity="0.8">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </path>

  <!-- Center Platform with Tech Details -->
  <ellipse cx="400" cy="360" rx="160" ry="80" fill="#475569" stroke="#1e293b" stroke-width="6"/>
  <rect x="300" y="330" width="200" height="60" fill="#64748b" opacity="0.6"/>
  <line x1="320" y1="335" x2="320" y2="385" stroke="#3b82f6" stroke-width="2"/>
  <line x1="350" y1="335" x2="350" y2="385" stroke="#3b82f6" stroke-width="2"/>
  <line x1="380" y1="335" x2="380" y2="385" stroke="#3b82f6" stroke-width="2"/>
  <line x1="420" y1="335" x2="420" y2="385" stroke="#3b82f6" stroke-width="2"/>
  <line x1="450" y1="335" x2="450" y2="385" stroke="#3b82f6" stroke-width="2"/>
  <line x1="480" y1="335" x2="480" y2="385" stroke="#3b82f6" stroke-width="2"/>

  <!-- Text -->
  <text x="400" y="350" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#3b82f6" text-anchor="middle">Level 5</text>
  <text x="400" y="390" font-family="Arial, sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold">P.E.K.K.A's Playhouse</text>

  <!-- Stars -->
  <text x="260" y="130" font-size="38">⭐</text>
  <text x="340" y="110" font-size="38">⭐</text>
  <text x="420" y="100" font-size="38">⭐</text>
  <text x="500" y="110" font-size="38">⭐</text>
  <text x="580" y="130" font-size="38" opacity="0.3">⭐</text>
</svg>
