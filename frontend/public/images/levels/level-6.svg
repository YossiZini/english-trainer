<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Royal Arena - Majestic Golden Castle -->
  <defs>
    <linearGradient id="royalSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a1a5a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aad;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="goldGlow">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Royal Purple Sky -->
  <rect width="800" height="600" fill="url(#royalSky)"/>

  <!-- Stars in sky -->
  <circle cx="100" cy="80" r="2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="150" cy="60" r="3" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="200" cy="90" r="2" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="600" cy="70" r="2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="650" cy="50" r="3" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="700" cy="80" r="2" fill="#FFFFFF" opacity="0.7"/>

  <!-- Golden glow -->
  <ellipse cx="400" cy="300" rx="250" ry="150" fill="url(#goldGlow)" opacity="0.3"/>

  <!-- Ground -->
  <rect x="0" y="480" width="800" height="120" fill="#5a2a6a"/>

  <!-- Castle Towers -->
  <rect x="100" y="180" width="80" height="300" fill="url(#goldGrad)" stroke="#92400e" stroke-width="4"/>
  <path d="M 100 180 L 120 150 L 140 180 L 160 150 L 180 180 Z" fill="#fbbf24"/>
  <rect x="620" y="180" width="80" height="300" fill="url(#goldGrad)" stroke="#92400e" stroke-width="4"/>
  <path d="M 620 180 L 640 150 L 660 180 L 680 150 L 700 180 Z" fill="#fbbf24"/>

  <!-- Main Castle -->
  <rect x="220" y="200" width="360" height="280" fill="url(#goldGrad)" stroke="#92400e" stroke-width="6" rx="15"/>

  <!-- Castle Windows -->
  <rect x="260" y="240" width="40" height="60" fill="#4a1a5a" stroke="#2a0a3a" stroke-width="2" rx="20" opacity="0.8"/>
  <rect x="340" y="240" width="40" height="60" fill="#4a1a5a" stroke="#2a0a3a" stroke-width="2" rx="20" opacity="0.8"/>
  <rect x="420" y="240" width="40" height="60" fill="#4a1a5a" stroke="#2a0a3a" stroke-width="2" rx="20" opacity="0.8"/>
  <rect x="500" y="240" width="40" height="60" fill="#4a1a5a" stroke="#2a0a3a" stroke-width="2" rx="20" opacity="0.8"/>

  <!-- Castle Gate -->
  <path d="M 350 480 L 350 380 Q 350 360 370 360 L 430 360 Q 450 360 450 380 L 450 480 Z" fill="#2a0a3a" stroke="#92400e" stroke-width="4"/>

  <!-- Royal Banners -->
  <rect x="240" y="190" width="8" height="100" fill="#92400e"/>
  <path d="M 240 190 L 240 230 L 280 210 Z" fill="#7c3aad"/>
  <rect x="552" y="190" width="8" height="100" fill="#92400e"/>
  <path d="M 560 190 L 560 230 L 520 210 Z" fill="#7c3aad"/>

  <!-- Crown on top -->
  <path d="M 360 180 L 370 160 L 380 175 L 390 155 L 400 170 L 410 155 L 420 175 L 430 160 L 440 180 Z" fill="#fbbf24" stroke="#92400e" stroke-width="2">
    <animate attributeName="fill" values="#fbbf24;#fcd34d;#fbbf24" dur="2s" repeatCount="indefinite"/>
  </path>
  <circle cx="390" cy="155" r="5" fill="#dc2626"/>
  <circle cx="410" cy="155" r="5" fill="#dc2626"/>

  <!-- Royal Torches with Purple Flame -->
  <rect x="110" y="170" width="15" height="60" fill="#92400e"/>
  <ellipse cx="117.5" cy="160" rx="18" ry="28" fill="#a855f7" opacity="0.9">
    <animate attributeName="ry" values="25;32;25" dur="1.5s" repeatCount="indefinite"/>
  </ellipse>
  <rect x="675" y="170" width="15" height="60" fill="#92400e"/>
  <ellipse cx="682.5" cy="160" rx="18" ry="28" fill="#a855f7" opacity="0.9">
    <animate attributeName="ry" values="28;35;28" dur="1.5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Center Royal Platform -->
  <ellipse cx="400" cy="380" rx="170" ry="85" fill="#7c3aad" stroke="#fbbf24" stroke-width="6"/>

  <!-- Text -->
  <text x="400" y="365" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#fbbf24" text-anchor="middle">Level 6</text>
  <text x="400" y="405" font-family="Arial, sans-serif" font-size="30" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Royal Arena</text>

  <!-- 5 Stars - Maximum Achievement -->
  <text x="240" y="120" font-size="40">⭐</text>
  <text x="320" y="100" font-size="40">⭐</text>
  <text x="400" y="85" font-size="40">⭐</text>
  <text x="480" y="100" font-size="40">⭐</text>
  <text x="560" y="120" font-size="40">⭐</text>

  <!-- Sparkles -->
  <text x="180" y="200" font-size="25" opacity="0.7">✨</text>
  <text x="620" y="210" font-size="25" opacity="0.7">✨</text>
</svg>
