# Cloud Run service definition for the English Trainer API.
#
# CI substitutes the image tag and applies it with:
#   gcloud run services replace infra/cloudrun-service.yaml --region me-west1
# Public access is granted once by:
#   gcloud run services add-iam-policy-binding english-trainer-api \
#     --region me-west1 --member=allUsers --role=roles/run.invoker
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: english-trainer-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: english-trainer-api@teacher-509909.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: me-west1-docker.pkg.dev/teacher-509909/english-trainer/api:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: CORS_ORIGINS
              value: https://teacher-509909.web.app,https://teacher-509909.firebaseapp.com
            - name: JWT_EXPIRATION
              value: 7d
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10
